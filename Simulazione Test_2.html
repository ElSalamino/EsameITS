        body {

        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px; /* Più compatto su mobile */
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        @media (min-width: 768px) {
            .container { padding: 35px; }
            body { padding: 20px; }
        }
        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .subject-block {
            margin-bottom: 35px;
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 15px;
        }
        .subject-block:last-of-type {
            border-bottom: none;
        }
        .subject-title {
            background-color: #1e3a8a;
            color: white;
            padding: 10px 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .question {
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #cbd5e1;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 1rem;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        label {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            /* Ottimizzazione touch per iPhone */
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
        }
        label:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        input[type="radio"] {
            -webkit-appearance: none; /* Reset iOS standard */
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            outline: none;
            background-color: #fff;
            margin: 0;
            display: grid;
            place-content: center;
            cursor: pointer;
        }
        input[type="radio"]::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            background-color: #2563eb;
        }
        input[type="radio"]:checked {
            border-color: #2563eb;
        }
        input[type="radio"]:checked::before {
            transform: scale(1);
        }
        button {
            -webkit-appearance: none; /* Reset iOS */
            display: block;
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 30px;
            -webkit-tap-highlight-color: transparent;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            opacity: 1; /* Forza opacità su iOS */
        }
        #result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.25rem;
            display: none;
        }
        .success {
            background-color: #dcfce7;
            color: #14532d;
            border: 1px solid #bbf7d0;
        }
        .fail {
            background-color: #fee2e2;
            color: #7f1d1d;
            border: 1px solid #fca5a5;
        }
        /* Classi per la correzione visiva */
        .opt-correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
            font-weight: bold;
        }
        .opt-wrong {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
            font-weight: bold;
        }
        /* Forza il colore del pallino interno anche quando disabilitato */
        input[type="radio"]:disabled {
            cursor: not-allowed;
        }
    </style>
</head>

const selected = [];

function sf(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function go() {
    const c = document.getElementById('quiz-container');
    c.innerHTML = '';
    selected.length = 0;
    
    const subs = Object.keys(db);
    sf(subs);
    const chosen = subs.slice(0, 6);
    let gIdx = 0;
    
    chosen.forEach(s => {
        const b = document.createElement('div');
        b.className = 'subject-block';
        const t = document.createElement('div');
        t.className = 'subject-title';
        t.innerText = s;
        b.appendChild(t);
        
        const qs = [...db[s]];
        sf(qs);
        const cq = qs.slice(0, 5);
        
        cq.forEach(qD => {
            const origC = qD.a[qD.c];
            const opts = [...qD.a];
            sf(opts);
            const newC = opts.indexOf(origC);
            
            selected.push({correct: newC, name: `q-${gIdx}`});
            
            const qDiv = document.createElement('div');
            qDiv.className = 'question';
            const qT = document.createElement('div');
            qT.className = 'question-text';
            qT.innerText = `${gIdx + 1}. ${qD.q}`;
            qDiv.appendChild(qT);
            
            const oDiv = document.createElement('div');
            oDiv.className = 'options';
            
            opts.forEach((o, oI) => {
                const l = document.createElement('label');
                l.id = `lbl-${gIdx}-${oI}`;
                
                // Fix iOS: Aggiunge una funzione vuota al tocco per forzare la reattività delle label
                l.setAttribute('onclick', 'void(0)');
                
                const r = document.createElement('input');
                r.type = 'radio';
                r.name = `q-${gIdx}`;
                r.value = oI;
                
                l.appendChild(r);
                l.appendChild(document.createTextNode(o));
                oDiv.appendChild(l);
            });
            
            qDiv.appendChild(oDiv);
            b.appendChild(qDiv);
            gIdx++;
        });
        c.appendChild(b);
    });
}

function chk() {
    let score = 0;
    
    // Disabilita tutti gli input radio per impedire modifiche
    const inputs = document.querySelectorAll('input[type="radio"]');
    inputs.forEach(i => i.disabled = true);
    
    // Disabilita i clic sulle label
    const labels = document.querySelectorAll('label');
    labels.forEach(l => l.style.pointerEvents = 'none');
    
    // Disabilita il pulsante di invio
    document.getElementById('btn-submit').disabled = true;
    
    // Controlla e colora le risposte
    for (let i = 0; i < 30; i++) {
        const rs = document.getElementsByName(`q-${i}`);
        let val = -1;
        for (const r of rs) {
            if (r.checked) {
                val = parseInt(r.value);
                break;
            }
        }
        
        const corrIdx = selected[i].correct;
        
        if (val === corrIdx) {
            score++;
            const cL = document.getElementById(`lbl-${i}-${corrIdx}`);
            if (cL) cL.classList.add('opt-correct');
        } else {
            if (val !== -1) {
                const wL = document.getElementById(`lbl-${i}-${val}`);
                if (wL) wL.classList.add('opt-wrong');
            }
            const cL = document.getElementById(`lbl-${i}-${corrIdx}`);
            if (cL) cL.classList.add('opt-correct');
        }
    }
    
    const rDiv = document.getElementById('result');
    rDiv.style.display = 'block';
    
    if (score >= 18) {
        rDiv.className = 'success';
        rDiv.innerHTML = `🎓 Esame Superato!<br>Risposte esatte: <strong>${score}</strong> su 30.<br>Punteggio: <strong>${score}/30</strong>`;
    } else {
        rDiv.className = 'fail';
        rDiv.innerHTML = `📚 Non superato.<br>Risposte esatte: <strong>${score}</strong> su 30.<br>Punteggio: <strong>${score}/30</strong>`;
    }
    
    rDiv.scrollIntoView({behavior: 'smooth'});
}

window.onload = go;
</script>
